[project]
name = "anicat-v2"
version = "0.3.0"
description = "Anime1 downloader CLI with resumable concurrent downloads."
authors = [
    {name = "HeiTang",email = "heitang.me@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]

[project.scripts]
anicat = "anicat.cli:main"

[tool.poetry]
packages = [{include = "anicat", from = "src"}]
include = ["src/anicat/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]
ignore = [
    "RUF001",
]

[tool.pyright]
include = ["src/anicat", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.0,<5.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)"
]
