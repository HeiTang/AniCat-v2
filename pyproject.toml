[project]
name = "anicat"
version = "0.3.0"
description = "Anime1 downloader CLI with resumable concurrent downloads."
authors = [
    {name = "HeiTang",email = "heitang.me@gmail.com"}
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "cryptography (>=46.0.7,<51.0.0)",
    "imageio-ffmpeg>=0.8.1,<0.9",
]

[project.urls]
Repository = "https://github.com/HeiTang/AniCat-v2"
Issues = "https://github.com/HeiTang/AniCat-v2/issues"
Changelog = "https://github.com/HeiTang/AniCat-v2/blob/main/CHANGELOG.md"

[project.scripts]
anicat = "anicat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anicat = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]
ignore = [
    "RUF001",
]

[tool.pyright]
include = ["src/anicat", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false


[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.0,<5.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)"
]
