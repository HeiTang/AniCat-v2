name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked

      - name: Validate package metadata
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Run tests without system FFmpeg
        run: |
          uv run python - <<'PY'
          import os
          import runpy
          import shutil
          import subprocess

          os.environ["PATH"] = ""
          os.environ.pop("IMAGEIO_FFMPEG_EXE", None)
          assert shutil.which("ffmpeg") is None

          from anicat.ffmpeg import find_ffmpeg

          executable = find_ffmpeg()
          assert executable is not None
          print(f"Packaged FFmpeg: {executable}", flush=True)
          subprocess.run([executable, "-version"], check=True)
          runpy.run_module("unittest", run_name="__main__")
          PY

      - name: Compile sources
        run: uv run python -m compileall src/anicat tests

      - name: Build distributions
        run: uv build --no-sources
